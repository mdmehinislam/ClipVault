
name: Build ClipVault for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build universal macOS app
        run: |
          xcodebuild \
            -project ClipVault.xcodeproj \
            -scheme ClipVault \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          mkdir -p dist
          cp -R build/Build/Products/Release/ClipVault.app dist/
          ln -s /Applications dist/Applications
          hdiutil create \
            -volname "ClipVault" \
            -srcfolder dist \
            -ov -format UDZO \
            ClipVault.dmg

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-macOS-Installer
          path: ClipVault.dmg
          retention-days: 30
